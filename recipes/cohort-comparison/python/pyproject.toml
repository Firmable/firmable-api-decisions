[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-cohort-comparison"
version = "0.1.0"
description = "Compare Decisions answers between two company cohorts with explicit denominators."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-cohort-comparison = "cohort_comparison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
