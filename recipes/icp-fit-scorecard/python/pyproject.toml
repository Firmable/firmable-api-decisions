[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-icp-fit-scorecard"
version = "0.1.0"
description = "Score accounts against your ICP criteria with Firmable is_icp_fit and show each criterion."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-icp-fit-scorecard = "icp_fit_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
