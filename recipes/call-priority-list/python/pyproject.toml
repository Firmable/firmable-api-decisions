[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmable-call-priority-list"
version = "0.1.0"
description = "Prioritise a contact list for calling using seniority, department and reachability answers."
requires-python = ">=3.11"
dependencies = ["firmable-api-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firmable-call-priority-list = "call_priority_list.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
